<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Journal — Les Rubis Noirs</title>
  <meta name="description" content="Le Journal des Rubis Noirs : parcours, carrière, études, entrepreneuriat, société et inspiration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="journal">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <div id="site-header"></div>

  <main id="main">
    <header class="page-hero">
      <div class="wrap">
        <nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> / Le Journal</nav>
        <span class="label label-ruby">Le magazine des Rubis Noirs</span>
        <h1 class="display">Le <em>Journal</em></h1>
        <p class="lead">Portraits longs, conseils, réflexions et histoires courtes : le Journal prolonge les conversations du podcast entre deux épisodes.</p>
      </div>
    </header>

    <section class="section-sm">
      <div class="wrap">
        <a class="feature-article reveal" id="feature" href="#"></a>
      </div>
    </section>

    <section class="wrap">
      <div class="tabs" id="tabs" role="group" aria-label="Catégories"></div>
      <div class="cards-3 mt-l" id="grid"></div>
    </section>

    <section class="section">
      <div class="wrap center">
        <div class="orn"><span>✦</span></div>
        <p class="h3 mt-m">Recevoir les nouveaux articles ?</p>
        <a class="btn btn-ink mt-m" href="index.html#newsletter">Rejoindre la newsletter <span class="ar" aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    (function () {
      const RN = window.RN, esc = RN.esc;
      const [first, ...rest] = RN.articles;
      const f = document.getElementById("feature");
      f.href = `article.html?id=${first.id}`;
      f.innerHTML = `
        <div class="ph no-figure ${first.tone}" data-label="Visuel à la une"></div>
        <div>
          <span class="label label-ruby">À la une · ${esc(first.category)}</span>
          <h2>${esc(first.title)}</h2>
          <p class="lead">${esc(first.excerpt)}</p>
          <p class="label muted mt-m">${RN.formatDate(first.date, RN.lang())} · ${first.read} de lecture</p>
        </div>`;

      let cat = null;
      const tabs = document.getElementById("tabs"), grid = document.getElementById("grid");
      function render() {
        const t = (v, on) => `<button type="button" data-v="${v}" aria-pressed="${on}">${v}</button>`;
        tabs.innerHTML = t("Tout", !cat) + RN.journalCats.map((c) => t(c, c === cat)).join("");
        const items = cat ? RN.articles.filter((a) => a.category === cat) : rest;
        grid.innerHTML = items.length ? items.map(RN.articleCard).join("") : `<p class="muted">Aucun article dans cette catégorie pour le moment.</p>`;
        RN.observeReveal(grid);
      }
      tabs.addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        cat = b.dataset.v === "Tout" ? null : b.dataset.v; render();
      });
      render();
      RN.observeReveal();
    })();
  </script>
</body>
</html>
